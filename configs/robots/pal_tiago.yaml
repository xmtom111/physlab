id: pal_tiago
display_name: PAL Tiago
kind: mobile_manipulator
license: Apache-2.0
available: true
sim:
  source: menagerie
  menagerie_dir: pal_tiago
  xml_file: tiago_position.xml
  arm_joints:
  - arm_1_joint
  - arm_2_joint
  - arm_3_joint
  - arm_4_joint
  - arm_5_joint
  - arm_6_joint
  - arm_7_joint
  arm_actuators:
  - arm_position_1_position
  - arm_position_2_position
  - arm_position_3_position
  - arm_position_4_position
  - arm_position_5_position
  - arm_position_6_position
  - arm_position_7_position
  ee_body: arm_7_link
  home_qpos_rad:
  - 0.2
  - -1.34
  - -0.2
  - 1.94
  - -1.57
  - 1.37
  - 0.0
  gripper:
    actuator: gripper_left_finger_position
    open_ctrl: 0.0449775
    closed_ctrl: 2.25e-05
    finger_geoms: []
    attach_from: null
  base_type: diff_drive
  base_joints:
  - wheel_left_joint
  - wheel_right_joint
  base_actuators:
  - wheel_left_joint_vel
  - wheel_right_joint_vel
real:
  driver: null
  sdk_package: null
  notes: Actuators come from tiago_position.xml. Finger ctrlrange is the compiled
    inheritrange 0.999 of the 0 to 0.045 slide. The right finger actuator is gripper_right_finger_position.
    Finger geoms are unnamed.
