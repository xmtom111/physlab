[project]
name = "physlab"
version = "0.1.0"
description = "Sim-to-real lab framework for robot arms, fabrication, and experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "physlab contributors" }]
keywords = ["robotics", "mujoco", "simulation", "fabrication", "experiments"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mujoco>=3.2",
  # MuJoCo imports PyOpenGL. The vendored wheel drops a stray egg-info file
  # that makes `uv run` fail. See vendor/README.md.
  "pyopengl==3.1.0",
  "mink>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "opencv-contrib-python-headless>=4.8",
  "trimesh>=4.0",
  "build123d>=0.8",
  "mcp>=1.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "imageio[ffmpeg]>=2.34",
  "httpx>=0.27",
]

[project.optional-dependencies]
# stretch_body is the import name. PyPI publishes it as hello-robot-stretch-body.
real = [
  "xarm-python-sdk>=1.11.7",
  "lerobot>=0.1.0",
  "ur-rtde>=1.5.0",
  "franky-control>=1.0.0",
  "piper_sdk>=0.0.12",
  "hello-robot-stretch-body>=0.7.0",
  "pyrealsense2>=2.54.0",
]

[project.scripts]
physlab = "physlab.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  # PyYAML and scipy.spatial.transform do not ship the stubs mypy --strict needs.
  "scipy-stubs>=1.14",
  "types-PyYAML>=6.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# MuJoCo depends on PyOpenGL. PyPI's 3.1.0 sdist builds a wheel that also
# installs PyOpenGL-3.1.0.egg-info, which current uv refuses to uninstall, so
# the next `uv run` fails. The wheel in vendor/ is that build with the extra
# egg-info file removed. The Python code is unchanged.
[tool.uv.sources]
pyopengl = { path = "vendor/pyopengl-3.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/physlab"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["physlab"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["physlab"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "hardware: tests that require real hardware (excluded by -m 'not hardware')",
  "render: tests that require a GL renderer",
  "slow: tests that take longer than 10 seconds",
  "assets: tests that need assets/mujoco_menagerie from physlab assets fetch",
]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["physlab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
